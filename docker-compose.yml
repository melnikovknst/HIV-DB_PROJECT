services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hiv_project_test
      POSTGRES_USER: hiv_user
      POSTGRES_PASSWORD: hiv_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hiv_project_test
      DB_USER: hiv_user
      DB_PASSWORD: hiv_password
      FLASK_SECRET: local-demo-change-me
      APP_PORT: 5050
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:5050"

volumes:
  postgres_data:
